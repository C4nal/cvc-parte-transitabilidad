# ============================================================
# CVC - Robot del parte de transitabilidad (GitHub Actions)
# Corre solo en la nube. Baja el parte + titulares y actualiza parte.json.
# La publicacion la hace GitHub Pages solo: cada commit del robot republica
# el sitio (parte.json + overlay.html) en https://USUARIO.github.io/REPO/
# Deja un resumen legible en la pestaña Actions (sin necesidad de email).
# GitHub avisa automaticamente por mail si algun run FALLA.
#
# Este archivo va en:  .github/workflows/actualizar-parte.yml
# ============================================================
name: Actualizar parte de transitabilidad

on:
  schedule:
    # Cada 2 horas (minuto 10 para esquivar la congestion de GitHub en punto).
    # Los horarios de cron van en UTC (Argentina = UTC-3).
    - cron: "10 */2 * * *"
  workflow_dispatch:        # boton para correrlo a mano cuando quieras

permissions:
  contents: write           # para poder guardar parte.json en el repo

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el robot (genera parte.json)
        env:
          I24_TOKEN: ${{ secrets.I24_TOKEN }}
        run: python scraper.py

      - name: Guardar parte.json si cambio
        run: |
          git config user.name  "robot-parte"
          git config user.email "robot-parte@users.noreply.github.com"
          if ! git diff --quiet -- parte.json; then
            git add parte.json
            git commit -m "Parte actualizado automaticamente"
            # Si alguien subio cambios al repo mientras corria el robot,
            # se integran antes de publicar (evita el error "fetch first").
            git pull --rebase -X theirs origin main
            git push
            echo "parte.json actualizado y publicado."
          else
            echo "Sin cambios en el parte."
          fi

      - name: Mostrar resumen y diagnostico (siempre)
        if: always()
        run: |
          if [ -f resumen.md ]; then
            cat resumen.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se genero resumen.md (el robot no llego a correr)." >> "$GITHUB_STEP_SUMMARY"
          fi
